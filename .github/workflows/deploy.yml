name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
  

      - name: Install dependencies
        working-directory: campus-event-scheduling-main/f2
        run: npm ci

      - name: Build React app
        working-directory: campus-event-scheduling-main/f2
        run: npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: campus-event-scheduling-main/f2/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
